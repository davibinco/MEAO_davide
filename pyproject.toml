[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meao"
version = "1.0.0"
description = "MEAO (Multi-Reference Effective Atomic Orbitals) package"
requires-python = ">=3.10"
dependencies = [
    "h5py",
    "networkx",
    "numpy",
    "pyscf",
    "scipy",
    "block2",
]

[tool.setuptools]
py-modules = ["meao", "tools"]