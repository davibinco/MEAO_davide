[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meao"
version = "1.0.0"
description = "MEAO (Multi-Reference Effective Atomic Orbitals) package"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.16.0",
    "networkx>=3.6.1",
    "numpy>=2.4.4",
    "pyscf>=2.12.1",
    "scipy>=1.17.1",
]

# This tells setuptools how to handle your "flat" repository structure
# where meao.py and tools.py sit directly in the root folder.
[tool.setuptools]
py-modules = ["meao", "tools"]